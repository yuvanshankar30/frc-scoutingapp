<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" sizes="512x512" href="/favicon.png" type="image/png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="theme-color" content="#0b1020" />
		<!-- viewport-fit=cover lets the layout use the notch and home-indicator safe areas (env(safe-area-inset-*)). -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- Added to a phone's home screen, the app opens on its own, without browser toolbars. -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
		<script>
			// Apply the saved theme and style before render to avoid a flash of the wrong ones. With nothing saved,
			// the team's default theme (Team settings) applies once the page loads.
			try {
				var t = localStorage.getItem('scouting-theme');
				document.documentElement.setAttribute('data-theme', t === 'modern' ? 'modern' : 'modern-dark');
				if (localStorage.getItem('scouting-style') === 'pit-board') document.documentElement.setAttribute('data-style', 'pit-board');
			} catch (e) {
				document.documentElement.setAttribute('data-theme', 'modern-dark');
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
